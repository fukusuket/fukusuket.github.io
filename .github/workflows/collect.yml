name: Collect threat feeds

on:
  schedule:
    - cron: "0 10 * * *"   # 19:00 JST
    - cron: "0 21 * * *"   # 06:00 JST (next day)
  workflow_dispatch:
    inputs:
      days_back:
        description: "Days of feed history to collect (DAYS_BACK)"
        required: false
        default: "1"
        type: string

# Default for every job; the publish job raises its own.
permissions:
  contents: read

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  # Runs ThreatfeedCollector. Deliberately has no write permission and no
  # persisted git credential, so third-party code and its pip dependencies
  # never share a workspace with a token that can push to this repo.
  collect:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: fukusuket/ThreatfeedCollector
          path: collector
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: collector/requirements.txt

      - name: Install dependencies
        run: pip install -r collector/requirements.txt

      # The collector merges into an existing ioc_stats_<date>.csv in its CWD and
      # dedupes on blog url, so restoring today's file keeps the 19:00 JST run
      # from dropping what the 06:00 JST run already collected.
      - name: Restore today's CSV for merging
        run: |
          d=$(date -u +%Y%m%d)
          src="$(date -u +%Y/%m)/ioc_stats_${d}.csv"
          if [ -f "$src" ]; then
            cp "$src" "collector/ioc_stats_${d}.csv"
            echo "Restored $src for merge"
          fi

      - name: Collect
        env:
          # The inputs context is empty on a schedule run, so it falls back to 1.
          DAYS_BACK: ${{ inputs.days_back || '1' }}
        working-directory: collector
        run: python3 ioc_collect.py --no-misp

      - name: Stage CSV
        run: |
          csv=$(ls collector/ioc_stats_*.csv 2>/dev/null | tail -n 1)
          if [ -z "$csv" ]; then
            echo "No stats CSV produced" >&2
            exit 1
          fi
          mkdir -p stats
          cp "$csv" stats/
          echo "Staged $(basename "$csv") ($(($(wc -l < "$csv") - 1)) rows)"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ioc-stats
          path: stats/
          retention-days: 1

  # Only first-party code runs here: tools/render.py is standard library only.
  # The collector and its dependencies are never installed in this job.
  publish:
    needs: collect
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ioc-stats
          path: stats

      - name: Place CSV into yyyy/mm/
        run: |
          csv=$(ls stats/ioc_stats_*.csv 2>/dev/null | tail -n 1)
          if [ -z "$csv" ]; then
            echo "No stats CSV in artifact" >&2
            exit 1
          fi
          name=$(basename "$csv")
          d=${name#ioc_stats_}
          d=${d%.csv}
          dir="${d:0:4}/${d:4:2}"
          mkdir -p "$dir"
          cp "$csv" "$dir/$name"
          rm -rf stats
          echo "Wrote $dir/$name"

      - name: Render index.html
        run: python3 tools/render.py

      - name: Commit & push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "chore: threat feed $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          fi
